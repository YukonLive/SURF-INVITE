    // its direct parent (which, for every document the publisher's own

    // text from that direct parent; requests from below are honored only

th:25%;aspect-ratio:1;padding:0;border:0;background:none;cursor:pointer;opacity:{{ sealOpacity }};transform:{{ sealTransform }};transition:opacity 500ms var(--ease-tide),transform 600ms var(--ease-tide);filter:drop-shadow(0 4px 4px rgba(42,32,25,.35)) drop-shadow(0 10px 14px rgba(42,32,25,.2))\">\n        <img src=\"c7701910-a2bf-443a-9c30-1e34d9e146eb\" alt=\"\" style=\"width:100%;height:100%;display:block;pointer-events:none\">\n      <\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;opacity:{{ uiOpacity }};transition:opacity 900ms var(--ease-tide)\">\n      <p style=\"margin:0;font-family:var(--font-serif);font-weight:400;font-size:clamp(20px,1.7vw,24px);line-height:1.5;color:var(--surf-sand)\">{{ forLine }}<\u002Fp>\n      <x-import component-from-global-scope=\"SURFDesignSystem_33f44e.Button\" variant=\"secondary\" on-dark=\"{{ true }}\" on-click=\"{{ open }}\" dc-props=\"{{ sealBtnProps }}\" hint-size=\"220px,48px\">Break the seal<\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== Invitation page ===== -->\n  <main style=\"opacity:{{ pageOpacity }};transition:opacity 1400ms var(--ease-tide)\">\n\n    <section data-screen-label=\"Welcome\" style=\"display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(48px,5vw,64px);padding:clamp(96px,11vw,160px) var(--gutter);padding-bottom:0\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:48px\">\n        <img src=\"e0ec7522-b152-405c-84c3-5df27192deee\" alt=\"SURF emblem\" style=\"height:64px;width:auto;display:block\">\n        <h1 style=\"margin:0;font-family:var(--font-serif);font-weight:400;font-size:clamp(44px,5vw,64px);line-height:1.1;text-wrap:balance;color:var(--surf-bronze);\"><sc-if value=\"{{ hasName }}\" hint-placeholder-val=\"{{ true }}\">{{ name }},<br>you’re on the inside.<\u002Fsc-if><sc-if value=\"{{ noName }}\" hint-placeholder-val=\"{{ false }}\">You’re on the inside.<\u002Fsc-if><\u002Fh1>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-screen-label=\"Story\" style=\"display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(48px,5vw,64px);padding:calc(clamp(96px,11vw,160px) - 30px) var(--gutter) calc(clamp(64px,6vw,96px) - 30px);\">\n      <div style=\"width:48px;height:1px;background:var(--surf-bronze)\"><\u002Fdiv>\n      <h2 style=\"margin:0;max-width:16em;font-family:var(--font-serif);font-weight:400;font-size:clamp(34px,3.6vw,48px);line-height:1.15;text-wrap:balance;color:var(--surf-bronze);\">Before the Gold Coast knows its name, you’ll know its&nbsp;story.<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:32px;width:100%;max-width:1320px\">\n        <img src=\"79f25c13-67f9-4b56-8048-602cc2f51097\" alt=\"Aerial render of the tower on the Gold Coast skyline at dusk\" style=\"display:block;width:100%;aspect-ratio:16/9;object-fit:cover\">\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-screen-label=\"The conversation\" style=\"display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(48px,5vw,64px);padding:clamp(96px,11vw,160px) var(--gutter);padding-top:0\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:32px\">\n        <p style=\"margin:0;max-width:20em;font-family:var(--font-serif);font-weight:400;font-size:clamp(34px,3.6vw,48px);line-height:1.15;text-wrap:balance;color:var(--surf-bronze);\">You’re invited inside the making of the next project from the creators of Mondrian Gold Coast, in partnership with Gallery&nbsp;Group. A seat in the room with the people shaping what comes next for the Gold&nbsp;Coast.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-screen-label=\"The invitation\" style=\"display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(48px,5vw,64px);padding:clamp(96px,11vw,160px) var(--gutter);background:radial-gradient(120% 140% at 0% 0%,#C7B8A2 0%,#A69780 22%,#7D674F 52%,#624B36 76%,#4C3928 100%)\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:48px\">\n        <img src=\"ca6f7e3a-353c-4d8c-88d5-97502f637c2e\" alt=\"\" style=\"height:44px;width:auto;display:block\">\n        <h2 style=\"margin:0;font-family:var(--font-serif);font-weight:400;font-size:clamp(34px,3.6vw,48px);line-height:1.15;text-wrap:balance;color:var(--surf-sand);\">Thursday, October&nbsp;15<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(48px,8vw,120px)\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\">\n            <p style=\"margin:0;font-family:var(--font-serif);font-weight:400;font-size:18px;line-height:1.6;text-wrap:pretty;color:var(--surf-sand);opacity:.85\">Time<\u002Fp>\n            <p style=\"margin:0;font-family:var(--font-serif);font-weight:400;font-size:clamp(20px,1.7vw,24px);line-height:1.5;text-wrap:balance;color:var(--surf-sand);\">3pm – 7pm<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\">\n            <p style=\"margin:0;font-family:var(--font-serif);font-weight:400;font-size:18px;line-height:1.6;text-wrap:pretty;color:var(--surf-sand);opacity:.85\">Dress<\u002Fp>\n            <p style=\"margin:0;font-family:var(--font-serif);font-weight:400;font-size:clamp(20px,1.7vw,24px);line-height:1.5;text-wrap:balance;color:var(--surf-sand);\">Cocktail<\u002Fp>\n          <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px;width:100%;max-width:1280px\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:16px;padding:clamp(40px,5vw,64px) clamp(28px,4vw,48px);background:rgba(42,32,25,.28)\">\n            <p style=\"margin:0;font-family:var(--font-serif);font-weight:400;font-size:18px;line-height:1.6;text-wrap:pretty;color:var(--surf-sand);\">3:30pm – 4:30pm<\u002Fp>\n            <h3 style=\"margin:0;font-family:var(--font-serif);font-weight:400;font-size:clamp(28px,2.4vw,34px);line-height:1.2;text-wrap:balance;color:var(--surf-sand);\">A private<br>conversation<\u002Fh3>\n            <p style=\"margin:0;max-width:22em;font-family:var(--font-serif);font-weight:400;font-size:clamp(20px,1.7vw,24px);line-height:1.5;text-wrap:pretty;color:var(--surf-sand);\">Hear from Chris Vitale, Letitia Vitale and Adam Barclay on their vision for the Gold Coast, the project, and what it takes to create something truly&nbsp;iconic.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:16px;padding:clamp(40px,5vw,64px) clamp(28px,4vw,48px);background:rgba(42,32,25,.28)\">\n            <p style=\"margin:0;font-family:var(--font-serif);font-weight:400;font-size:18px;line-height:1.6;text-wrap:pretty;color:var(--surf-sand);\">5pm – 7pm<\u002Fp>\n            <h3 style=\"margin:0;font-family:var(--font-serif);font-weight:400;font-size:clamp(28px,2.4vw,34px);line-height:1.2;text-wrap:balance;color:var(--surf-sand);\">Pool Terrace<br>Discussions<\u002Fh3>\n            <p style=\"margin:0;max-width:22em;font-family:var(--font-serif);font-weight:400;font-size:clamp(20px,1.7vw,24px);line-height:1.5;text-wrap:pretty;color:var(--surf-sand);\">Further your discussions by the pool, over wine and food, in a Mondrian amenity space that showcases the quality and consideration given to every&nbsp;resident.<\u002Fp>\n          <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;max-width:1280px;font-family:var(--font-serif);font-weight:400;font-size:clamp(20px,1.7vw,24px);line-height:1.5;text-wrap:balance;color:var(--surf-sand);\">VIP guests to tour the Mondrian Penthouse in small groups. Speak to us to register a tour.<\u002Fp>\n    <\u002Fsection>\n\n    <section id=\"reserve\" data-screen-label=\"Your seat\" style=\"display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(48px,5vw,64px);padding:clamp(96px,11vw,160px) var(--gutter);\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:32px\">\n        <p style=\"margin:0;max-width:28em;font-family:var(--font-serif);font-weight:400;font-size:clamp(20px,1.7vw,24px);line-height:1.5;text-wrap:pretty;color:var(--surf-bronze);\">This access is not available to the public. It is yours because you are one of our&nbsp;partners.<\u002Fp>\n        <h2 style=\"margin:0;max-width:16em;font-family:var(--font-serif);font-weight:400;font-size:clamp(34px,3.6vw,48px);line-height:1.15;text-wrap:balance;color:var(--surf-bronze);\">Your invitation is exclusive. Your seat is&nbsp;limited.<\u002Fh2>\n        <p style=\"margin:0;max-width:28em;font-family:var(--font-serif);font-weight:400;font-size:clamp(20px,1.7vw,24px);line-height:1.5;text-wrap:pretty;color:var(--surf-bronze);\">To be in the room, you’ll need to reserve&nbsp;it.<\u002Fp>\n      <\u002Fdiv>\n      <x-import component-from-global-scope=\"SURFDesignSystem_33f44e.Button\" variant=\"primary\" size=\"lg\" on-click=\"{{ openReg }}\" dc-props=\"{{ ctaProps }}\" hint-size=\"340px,72px\">Reserve your seat<\u002Fx-import>\n    <\u002Fsection>\n\n    <footer data-screen-label=\"Footer\" style=\"display:flex;flex-direction:column;align-items:center;gap:clamp(48px,5vw,64px);padding:clamp(96px,11vw,160px) var(--gutter);background:radial-gradient(120% 140% at 100% 100%,#C7B8A2 0%,#A69780 22%,#7D674F 52%,#624B36 76%,#4C3928 100%)\">\n      <img src=\"fc04e608-08c4-4c30-beb0-e5b5bff45d0f\" alt=\"SURF\" style=\"width:320px;max-width:70vw;height:auto;display:block\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:32px\">\n        <p style=\"margin:0;font-family:var(--font-serif);font-weight:400;font-size:18px;line-height:1.6;text-wrap:pretty;color:var(--surf-sand);\">A joint venture by<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(40px,6vw,80px)\">\n          <img src=\"27d02b6c-28a7-46d4-8217-36c406a9aac5\" alt=\"Vitale\" style=\"height:44px;width:auto;display:block;mix-blend-mode:screen\">\n          <img src=\"1f51f60e-a682-4f7e-bcfc-26810b72ff8c\" alt=\"Gallery Group\" style=\"height:24px;width:auto;display:block\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Ffooter>\n  <\u002Fmain>\n\n\n  <sc-if value=\"{{ regOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeReg }}\" style=\"position:fixed;inset:0;z-index:60;background:rgba(76,57,40,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:clamp(16px,6vh,80px) 16px\">\n      <div role=\"dialog\" aria-modal=\"true\" aria-label=\"Reserve your seat\" sc-camel-on-click=\"{{ stop }}\" style=\"position:relative;width:100%;max-width:560px;box-sizing:border-box;background:var(--surf-sand);padding:clamp(48px,7vw,72px) clamp(24px,6vw,64px) clamp(40px,6vw,64px);display:flex;flex-direction:column;align-items:center;gap:32px;text-align:center;box-shadow:0 30px 60px -30px rgba(42,32,25,.6)\">\n        <button type=\"button\" aria-label=\"Close\" sc-camel-on-click=\"{{ closeReg }}\" style=\"position:absolute;top:16px;right:16px;width:44px;height:44px;padding:0;border:0;background:none;cursor:pointer\">\n          <span style=\"position:absolute;left:12px;top:21px;width:20px;height:1px;background:var(--surf-bronze);transform:rotate(45deg)\"><\u002Fspan>\n          <span style=\"position:absolute;left:12px;top:21px;width:20px;height:1px;background:var(--surf-bronze);transform:rotate(-45deg)\"><\u002Fspan>\n        <\u002Fbutton>\n        <img src=\"e0ec7522-b152-405c-84c3-5df27192deee\" alt=\"\" style=\"height:44px;width:auto;display:block\">\n\n        <sc-if value=\"{{ stepForm }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:16px\">\n            <h3 style=\"margin:0;font-family:var(--font-serif);font-weight:400;font-size:clamp(28px,2.4vw,34px);line-height:1.2;text-wrap:balance;color:var(--surf-bronze);\">Reserve your seat<\u002Fh3>\n            <p style=\"margin:0;max-width:22em;font-family:var(--font-serif);font-weight:400;font-size:18px;line-height:1.6;text-wrap:pretty;color:var(--surf-bronze);\">Confirm your details to reserve your&nbsp;seat.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:24px;width:100%\">\n            <label style=\"display:flex;flex-direction:column;gap:6px;width:100%;text-align:left\">\n              <span style=\"font-family:var(--font-serif);font-weight:400;font-size:18px;line-height:1.6;text-wrap:pretty;color:var(--surf-bronze);\">First name<\u002Fspan>\n              <input value=\"{{ first }}\" sc-camel-on-change=\"{{ onFirst }}\" autocomplete=\"given-name\" name=\"given-name\" style=\"width:100%;box-sizing:border-box;background:transparent;border:0;border-bottom:1px solid rgba(118,95,77,.35);border-radius:0;padding:8px 0 10px;font-family:var(--font-serif);font-weight:400;font-size:20px;line-height:1.3;color:var(--surf-bronze);outline:none\" style-focus=\"border-bottom:1px solid #765F4D\">\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px;width:100%;text-align:left\">\n              <span style=\"font-family:var(--font-serif);font-weight:400;font-size:18px;line-height:1.6;text-wrap:pretty;color:var(--surf-bronze);\">Last name<\u002Fspan>\n              <input value=\"{{ last }}\" sc-camel-on-change=\"{{ onLast }}\" autocomplete=\"family-name\" name=\"family-name\" style=\"width:100%;box-sizing:border-box;background:transparent;border:0;border-bottom:1px solid rgba(118,95,77,.35);border-radius:0;padding:8px 0 10px;font-family:var(--font-serif);font-weight:400;font-size:20px;line-height:1.3;color:var(--surf-bronze);outline:none\" style-focus=\"border-bottom:1px solid #765F4D\">\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px;width:100%;text-align:left\">\n              <span style=\"font-family:var(--font-serif);font-weight:400;font-size:18px;line-height:1.6;text-wrap:pretty;color:var(--surf-bronze);\">Mobile number<\u002Fspan>\n              <input value=\"{{ phone }}\" sc-camel-on-change=\"{{ onPhone }}\" type=\"tel\" inputmode=\"tel\" autocomplete=\"tel\" name=\"tel\" placeholder=\"04xx xxx xxx\" style=\"width:100%;box-sizing:border-box;background:transparent;border:0;border-bottom:1px solid rgba(118,95,77,.35);border-radius:0;padding:8px 0 10px;font-family:var(--font-serif);font-weight:400;font-size:20px;line-height:1.3;color:var(--surf-bronze);outline:none\" style-focus=\"border-bottom:1px solid #765F4D\">\n            <\u002Flabel>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasErr }}\" hint-placeholder-val=\"{{ false }}\"><p role=\"alert\" style=\"margin:0;font-family:var(--font-serif);font-weight:400;font-size:18px;line-height:1.6;text-wrap:pretty;color:var(--surf-bronze);color:#9A4A3A\">{{ err }}<\u002Fp><\u002Fsc-if>\n          <x-import component-from-global-scope=\"SURFDesignSystem_33f44e.Button\" variant=\"primary\" size=\"lg\" disabled=\"{{ busy }}\" on-click=\"{{ submitReg }}\" dc-props=\"{{ formBtnProps }}\" hint-size=\"100%,60px\">{{ sendLabel }}<\u002Fx-import>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ stepDone }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:16px\">\n            <h3 style=\"margin:0;font-family:var(--font-serif);font-weight:400;font-size:clamp(28px,2.4vw,34px);line-height:1.2;text-wrap:balance;color:var(--surf-bronze);\">Your seat is reserved.<\u002Fh3>\n            <p style=\"margin:0;max-width:22em;font-family:var(--font-serif);font-weight:400;font-size:clamp(20px,1.7vw,24px);line-height:1.5;text-wrap:pretty;color:var(--surf-bronze);\">Thank you, {{ first }}. We look forward to welcoming you on Thursday, October&nbsp;15.<\u002Fp>\n          <\u002Fdiv>\n          <x-import component-from-global-scope=\"SURFDesignSystem_33f44e.Button\" variant=\"secondary\" size=\"lg\" on-click=\"{{ closeReg }}\" dc-props=\"{{ formBtnProps }}\" hint-size=\"200px,60px\">Close<\u002Fx-import>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <button type=\"button\" sc-camel-on-click=\"{{ replay }}\" style=\"position:fixed;right:20px;bottom:20px;z-index:40;padding:10px 20px;border:1px solid var(--surf-bronze);border-radius:999px;background:var(--surf-sand);color:var(--surf-bronze);font:600 16px/1 var(--font-sans);letter-spacing:.18em;text-transform:uppercase;cursor:pointer;opacity:{{ replayOpacity }};pointer-events:{{ replayPE }};transition:opacity 600ms var(--ease-tide)\">Replay<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;firstName&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;skipIntro&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;submitUrl&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Registration&quot;}}\">\nconst EMAILJS = { service: '', template: '', key: '' };\nclass Component extends DCLogic {\n  state = { ready: false, phase: -1, reg: null, first: '', last: '', phone: '', code: '', err: '', busy: false };\n  t = [];\n  componentDidMount() {\n    const go = () => setTimeout(() => {\n      this.setState({ ready: true });\n      if (this.props.skipIntro ?? false) this.setState({ phase: 5 }); else this.start();\n    }, 150);\n    if (document.readyState === 'complete') go(); else window.addEventListener('load', go, { once: true });\n  }\n  componentWillUnmount() { this.clear(); }\n  clear() { this.t.forEach(clearTimeout); this.t = []; }\n  at(p, ms) { this.t.push(setTimeout(() => this.setState({ phase: p }), ms)); }\n  start() { this.at(0, 80); this.t.push(setTimeout(this.open, 2080)); }\n  open = () => {\n    if (this.state.phase !== 0) return;\n    this.setState({ phase: 1 });\n    this.at(2, 450); this.at(3, 1150); this.at(4, 1700); this.at(5, 3700);\n  };\n  replay = () => {\n    this.clear(); window.scrollTo(0, 0);\n    this.setState({ phase: -1 }); this.start();\n  };\n  guestName() {\n    if (this._name === undefined) {\n      let n = '';\n      try { n = new URLSearchParams(location.search).get('name') || ''; } catch (e) {}\n      this._name = Component.clean(n);\n    }\n    return Component.clean(this.props.firstName || '') || this._name;\n  }\n  static clean(n) {\n    n = String(n).replace(/\\s+/g, ' ').trim();\n    if (!n || n.length > 40 || /[%{}\\[\\]<>*|]/.test(n)) return '';\n    if (n === n.toLowerCase() || n === n.toUpperCase()) n = n.toLowerCase().replace(/(^|[\\s\\-'])\\S/g, c => c.toUpperCase());\n    return n;\n  }\n\n  openReg = () => this.setState({ reg: 'form', first: this.state.first || this.guestName(), err: '' });\n  closeReg = () => { if (!this.state.busy) this.setState({ reg: null, err: '' }); };\n  static phone(p) {\n    let d = String(p).replace(/[^\\d+]/g, '');\n    if (/^0[45]\\d{8}$/.test(d)) return '+61' + d.slice(1);\n    if (/^61[45]\\d{8}$/.test(d)) return '+' + d;\n    if (/^\\+\\d{8,15}$/.test(d)) return d;\n    return null;\n  }\n  async post(url, body) {\n    if (/script\\.google(usercontent)?\\.com/.test(url)) {\n      await fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });\n      return {};\n    }\n    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(body) });\n    let j = {}; try { j = await r.json(); } catch (e) {}\n    if (!r.ok) throw new Error(j.error || 'Request failed');\n    return j;\n  }\n  wait(ms) { return new Promise(r => setTimeout(r, ms)); }\n  submitReg = async () => {\n    const { first, last, phone } = this.state;\n    if (!first.trim() || !last.trim()) return this.setState({ err: 'Please enter your first and last name.' });\n    const e164 = Component.phone(phone);\n    if (!e164) return this.setState({ err: 'Please enter a valid mobile number.' });\n    this.setState({ busy: true, err: '' });\n    try {\n      const full = first.trim() + ' ' + last.trim();\n      const when = new Date().toLocaleString('en-AU', { timeZone: 'Australia/Brisbane' });\n      const subject = 'RSVP - MONDRIAN EVENT';\n      const ej = { service: this.props.emailjsServiceId || EMAILJS.service, template: this.props.emailjsTemplateId || EMAILJS.template, key: this.props.emailjsPublicKey || EMAILJS.key };\n      if (ej.service && ej.template && ej.key) {\n        await this.post('https://api.emailjs.com/api/v1.0/email/send', {\n          service_id: ej.service, template_id: ej.template, user_id: ej.key,\n          template_params: { subject, to_email: 'jennifer.p@gallerygroup.com.au', first_name: first.trim(), last_name: last.trim(), full_name: full, mobile: e164, invited_as: this._name || '—', submitted: when }\n        });\n      } else {\n        await this.post(this.props.submitUrl || 'https://formsubmit.co/ajax/jennifer.p@gallerygroup.com.au', {\n          _subject: subject, _template: 'table', _captcha: 'false',\n          'First name': first.trim(), 'Last name': last.trim(), 'Mobile': e164, 'Invited as': this._name || '—', 'Submitted': when\n        });\n      }\n      this.setState({ busy: false, reg: 'done' });\n    } catch (e) { this.setState({ busy: false, err: 'Something went wrong. Please try again.' }); }\n  };\n  renderVals() {\n    const ph = this.state.phase;\n    const name = this.guestName();\n    return {\n      loaderOpacity: this.state.ready ? 0 : 1, loaderPE: this.state.ready ? 'none' : 'auto',\n      regOpen: !!this.state.reg, stepForm: this.state.reg === 'form', stepDone: this.state.reg === 'done',\n      first: this.state.first, last: this.state.last, phone: this.state.phone,\n      onFirst: e => this.setState({ first: e.target.value }), onLast: e => this.setState({ last: e.target.value }),\n      onPhone: e => this.setState({ phone: e.target.value }),\n      err: this.state.err, hasErr: !!this.state.err, busy: this.state.busy,\n      sendLabel: this.state.busy ? 'Reserving…' : 'Reserve my seat',\n      openReg: this.openReg, closeReg: this.closeReg, stop: e => e.stopPropagation(),\n      submitReg: this.submitReg,\n      formBtnProps: { style: { width: '100%', padding: '22px 32px', fontSize: 16, whiteSpace: 'nowrap' } },\n      name, hasName: !!name, noName: !name, forLine: name ? 'For ' + name : '',\n      open: this.open, replay: this.replay,\n      envOpacity: ph < 0 ? 0 : 1,\n      envTransform: ph < 0 ? 'translateY(28px)' : 'none',\n      sealOpacity: ph >= 1 ? 0 : 1,\n      sealTransform: ph >= 1 ? 'translate(-50%,-50%) translateY(-10px) scale(1.1) rotate(-8deg)' : 'translate(-50%,-50%)',\n      flapShadowOpacity: ph >= 2 ? 0 : 1,\n      flapTransform: ph >= 2 ? 'perspective(1600px) rotateX(-180deg)' : 'perspective(1600px) rotateX(0deg)',\n      flapZ: ph >= 3 ? 1 : 4,\n      cardTransform: ph >= 4 ? 'translateY(-64%)' : 'translateY(0)',\n      uiOpacity: ph === 0 ? 1 : 0,\n      stageOpacity: ph >= 5 ? 0 : 1,\n      stagePE: ph >= 5 ? 'none' : 'auto',\n      pageOpacity: ph >= 5 ? 1 : 0,\n      replayOpacity: ph >= 5 ? 1 : 0,\n      replayPE: ph >= 5 ? 'auto' : 'none',\n      markWidth: 320,\n      eyebrowLH: { lineHeight: 1.9, maxWidth: '36em' },\n      sealBtnProps: { style: { fontSize: 16, padding: '16px 36px', whiteSpace: 'nowrap' } },\n      ctaProps: { style: { padding: '28px clamp(40px, 5vw, 72px)', whiteSpace: 'nowrap', fontSize: 18, letterSpacing: '.22em' } }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
